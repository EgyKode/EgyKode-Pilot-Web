name: Deploy to Production (AWS S3 + CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: egykode-pilot-site-production
  CLOUDFRONT_DISTRIBUTION_ID: E1B9ABGRU6B07Q
  ROLE_TO_ASSUME: arn:aws:iam::991216470475:role/egykode-pilot-github-deploy

jobs:
  build-and-deploy:
    name: Build & Deploy to pilot.egykode.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Configure AWS Credentials (OIDC - Zero Long-lived Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: pilot-deploy-${{ github.run_id }}

      - name: Upload Immutable Assets (1-Year Cache)
        run: |
          aws s3 sync dist/assets s3://${{ env.S3_BUCKET }}/assets \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

      - name: Upload HTML & Mutable Files (Must-Revalidate)
        run: |
          aws s3 sync dist s3://${{ env.S3_BUCKET }} \
            --exclude "assets/*" \
            --cache-control "public,max-age=0,must-revalidate" \
            --delete \
            --only-show-errors

      - name: Invalidate CloudFront Edge Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' --output text
